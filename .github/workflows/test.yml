# The only workflow this repo had was the (now deleted) Pages deploy — nothing
# ran the tests. Every push runs the fast suite; the slow ceiling re-proof
# stays local (it takes ~10 minutes and needs no CI to be useful).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
