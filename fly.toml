app = "owpuzzle"
primary_region = "sjc"

[build]

[env]
  BASE_URL = "https://owpuzzle.fly.dev"

[[mounts]]
  source = "owpuzzle_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep one warm: a cold start cost players ~6s

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
