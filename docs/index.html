<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Old World — Combat Puzzles</title>
<style>
  :root {
    --bg: #efe3cb;
    --panel: #faf3e3;
    --ink: #392e1f;
    --muted: #7a6a52;
    --accent: #8c2f1b;
    --blue: #2b6cb0;
    --red: #b03030;
    --hex-line: #c9b891;
    --edge: #b9a680;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #221c12; --panel: #2f2819; --ink: #e8dcc4; --muted: #a89877;
            --hex-line: #57492f; --edge: #6a5a3f; --accent: #c25a3a; }
  }
  :root[data-theme="dark"] { --bg: #221c12; --panel: #2f2819; --ink: #e8dcc4; --muted: #a89877;
            --hex-line: #57492f; --edge: #6a5a3f; --accent: #c25a3a; }
  :root[data-theme="light"] { --bg: #efe3cb; --panel: #faf3e3; --ink: #392e1f; --muted: #7a6a52;
            --hex-line: #c9b891; --edge: #b9a680; --accent: #8c2f1b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  header { text-align: center; padding: 10px 12px 0; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: 5px; font-weight: 600; }
  header .day { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .puzzle-title { font-size: 17px; font-weight: bold; margin-top: 6px; color: var(--accent); }
  .brief { font-size: 14px; max-width: 480px; margin: 2px auto 0; padding: 0 8px; }
  .hud {
    display: flex; gap: 16px; align-items: center; justify-content: center;
    margin: 8px 0 0; font-size: 14px;
  }
  .orders b { font-size: 16px; }
  .order-pip { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); margin-left: 3px; vertical-align: middle; }
  .order-pip.spent { background: #d8c8ac; }
  #main-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 10px; width: 100%; max-width: 900px;
  }
  #board-wrap { width: 100%; max-width: 560px; padding: 4px; flex: 1 1 340px; }
  #preview-panel {
    background: #14161c; color: #e8e4d8; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; margin: 4px;
    font-family: system-ui, sans-serif;
  }
  /* Wide screens: the panel column is ALWAYS reserved so showing the
     breakdown never reflows the board mid-hover. */
  @media (min-width: 880px) {
    #main-row { flex-wrap: nowrap; }
    #preview-panel { display: block; flex: 0 0 300px; width: 300px; align-self: stretch; }
    #preview-panel:not(.show) > * { display: none; }
    #preview-panel:not(.show)::before {
      content: 'Select a unit and hover an enemy to preview the attack.';
      color: #6d7078; font-size: 12px;
    }
  }
  /* Narrow screens: fixed bottom sheet — overlays, never shifts layout. */
  @media (max-width: 879.98px) {
    #preview-panel { display: none; }
    #preview-panel.show {
      display: block; position: fixed; z-index: 30;
      bottom: 10px; left: 50%; transform: translateX(-50%);
      width: min(94vw, 340px);
      box-shadow: 0 6px 28px rgba(0,0,0,.55);
    }
  }
  #preview-panel h4 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: #ffb020; display: flex; align-items: center; gap: 6px;
  }
  #preview-panel .vs { display: flex; gap: 10px; }
  #preview-panel .col { flex: 1; }
  #preview-panel .who { display: flex; align-items: center; gap: 5px; font-weight: 600; margin-bottom: 3px; }
  #preview-panel .who img { width: 22px; height: 22px; border-radius: 50%; }
  #preview-panel .who img.p0 { background: rgb(110,160,210); }
  #preview-panel .who img.p1 { background: rgb(150,60,60); }
  #preview-panel .big { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #preview-panel .modline { display: flex; justify-content: space-between; color: #b9b4a4; font-size: 12px; }
  #preview-panel .modline .v.pos { color: #7fb069; }
  #preview-panel .modline .v.neg { color: #e06c5b; }
  #preview-panel hr { border: none; border-top: 1px solid #3a3d46; margin: 8px 0; }
  #preview-panel .result { display: flex; justify-content: space-between; font-size: 13px; }
  #preview-panel .result b.kill { color: #ff5040; }
  #preview-panel .result b.dmg { color: #ffb020; }
  #preview-panel .note { color: #b9b4a4; font-size: 12px; margin-top: 5px; }
  #preview-panel .arm { margin-top: 8px; text-align: center; color: #ffb020; font-size: 12px; }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .controls { display: flex; gap: 10px; margin: 6px 0 4px; }
  button {
    font-family: inherit; font-size: 15px; padding: 8px 18px;
    background: var(--panel); color: var(--ink);
    border: 1.5px solid var(--edge); border-radius: 8px; cursor: pointer;
  }
  button:active { background: #eadfc8; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status {
    min-height: 40px; font-size: 14px; text-align: center; max-width: 480px;
    padding: 4px 10px;
  }
  #result {
    display: none; text-align: center; background: var(--panel);
    border: 1.5px solid var(--edge); border-radius: 12px; padding: 14px 22px;
    margin: 6px; max-width: 440px;
  }
  #result.show { display: block; }
  #result h2 { margin: 0 0 6px; font-size: 20px; }
  .lesson { font-size: 13px; font-style: italic; color: var(--muted); margin-top: 8px; }
  .library { font-size: 13px; margin: 10px 0 18px; color: var(--muted); text-align: center; }
  .library a { color: var(--accent); margin: 0 4px; }
  /* puzzle library (home) */
  #home { width: 100%; max-width: 780px; padding: 10px 14px 30px; display: none; }
  #home.show { display: block; }
  #home .progress { text-align: center; font-size: 13.5px; color: var(--muted); margin-bottom: 4px; }
  #home .progress b { color: var(--accent); font-size: 16px; }
  #home h2.group {
    font-size: 12.5px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); margin: 22px 2px 10px; border-bottom: 1px solid var(--edge);
    padding-bottom: 5px;
  }
  #home .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .card { position: relative; display: flex; gap: 12px; align-items: flex-start; margin: 0; }
  .card:hover { border-color: var(--accent); }
  .card .hero {
    flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%;
    background: rgb(110,160,210); padding: 4px; box-sizing: border-box;
    border: 2px solid #2c2416;
  }
  .card .body { min-width: 0; }
  .card .done {
    position: absolute; top: 8px; right: 10px; font-size: 17px; color: #5f9e4c;
  }
  .card.solved { border-color: #5f9e4c; }
  .card .meta { margin-right: 20px; }
  .card .foes { margin-top: 6px; display: flex; gap: 4px; align-items: center; }
  .card .foes img { width: 22px; height: 22px; border-radius: 50%; padding: 2px; background: rgb(150,60,60); }
  .card .foes .vs { font-size: 11px; color: var(--muted); margin-right: 2px; letter-spacing: 1px; }
  .card {
    background: var(--panel); border: 1.5px solid var(--edge);
    border-radius: 12px; padding: 12px 14px;
    text-decoration: none; color: var(--ink);
  }
  .card:active { background: #eadfc8; }
  .card .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 { margin: 0; font-size: 16.5px; color: var(--accent); }
  .card .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card p { margin: 5px 0 0; font-size: 13px; }
  .back-link { font-size: 13px; margin-top: 4px; }
  .back-link a { color: var(--accent); text-decoration: none; }
  #auth-widget a { color: var(--accent); }
  .rated-btn { font-family: inherit; font-size: 15px; padding: 8px 20px; border-radius: 9px;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  /* hex styling */
  .hex { stroke: var(--hex-line); stroke-width: 1.2; }
  .hex.reach { cursor: pointer; }
  .hex.reach-glow { fill-opacity: 0.9; }
  .unit-chip { cursor: pointer; }
  .dmg-preview { font-family: Georgia, serif; font-weight: bold; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>OLD WORLD</h1>
    <div class="day"><span id="day-label"></span></div>
    <div class="puzzle-title" id="p-name"></div>
    <div class="brief" id="p-brief"></div>
    <div class="back-link" id="back-link"></div>
    <div id="auth-widget" style="font-size:12.5px;margin-top:5px;color:var(--muted)"></div>
  </header>
  <div id="home"></div>
  <div class="hud">
    <div class="orders">Orders: <span id="orders-pips"></span></div>
    <div class="orders" id="training-span" style="display:none"></div>
  </div>
  <div id="main-row">
    <div id="board-wrap"></div>
    <div id="preview-panel"></div>
  </div>
  <div class="controls">
    <button id="btn-undo">Undo</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-march" class="primary" style="display:none">Force March (−100 training)</button>
    <button id="btn-setup" class="primary" style="display:none">Set Up</button>
  </div>
  <div id="status"></div>
  <div id="result">
    <h2 id="result-title"></h2>
    <div id="result-body"></div>
    <div class="lesson" id="result-lesson"></div>
    <div style="margin-top:10px">
      <button class="primary" id="btn-next">Next puzzle ▶</button>
      <button id="btn-share">Share</button>
      <button id="btn-again">Try again</button>
    </div>
  </div>
  <div class="library" id="library"></div>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="engine.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
