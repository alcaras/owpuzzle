<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Old World — Daily Combat Puzzle</title>
<style>
  :root {
    --bg: #efe3cb;
    --panel: #faf3e3;
    --ink: #392e1f;
    --muted: #7a6a52;
    --accent: #8c2f1b;
    --blue: #2b6cb0;
    --red: #b03030;
    --hex-line: #c9b891;
    --edge: #b9a680;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #221c12; --panel: #2f2819; --ink: #e8dcc4; --muted: #a89877;
            --hex-line: #57492f; --edge: #6a5a3f; --accent: #c25a3a; }
  }
  :root[data-theme="dark"] { --bg: #221c12; --panel: #2f2819; --ink: #e8dcc4; --muted: #a89877;
            --hex-line: #57492f; --edge: #6a5a3f; --accent: #c25a3a; }
  :root[data-theme="light"] { --bg: #efe3cb; --panel: #faf3e3; --ink: #392e1f; --muted: #7a6a52;
            --hex-line: #c9b891; --edge: #b9a680; --accent: #8c2f1b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  header { text-align: center; padding: 10px 12px 0; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: 5px; font-weight: 600; }
  header .day { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .puzzle-title { font-size: 17px; font-weight: bold; margin-top: 6px; color: var(--accent); }
  .brief { font-size: 14px; max-width: 480px; margin: 2px auto 0; padding: 0 8px; }
  .hud {
    display: flex; gap: 16px; align-items: center; justify-content: center;
    margin: 8px 0 0; font-size: 14px;
  }
  .orders b { font-size: 16px; }
  .order-pip { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); margin-left: 3px; vertical-align: middle; }
  .order-pip.spent { background: #d8c8ac; }
  #board-wrap { width: 100%; max-width: 560px; padding: 4px; }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .controls { display: flex; gap: 10px; margin: 6px 0 4px; }
  button {
    font-family: inherit; font-size: 15px; padding: 8px 18px;
    background: var(--panel); color: var(--ink);
    border: 1.5px solid var(--edge); border-radius: 8px; cursor: pointer;
  }
  button:active { background: #eadfc8; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status {
    min-height: 40px; font-size: 14px; text-align: center; max-width: 480px;
    padding: 4px 10px;
  }
  #result {
    display: none; text-align: center; background: var(--panel);
    border: 1.5px solid var(--edge); border-radius: 12px; padding: 14px 22px;
    margin: 6px; max-width: 440px;
  }
  #result.show { display: block; }
  #result h2 { margin: 0 0 6px; font-size: 20px; }
  .lesson { font-size: 13px; font-style: italic; color: var(--muted); margin-top: 8px; }
  .library { font-size: 13px; margin: 10px 0 18px; color: var(--muted); text-align: center; }
  .library a { color: var(--accent); margin: 0 4px; }
  /* puzzle library (home) */
  #home { width: 100%; max-width: 560px; padding: 10px 12px 24px; display: none; }
  #home.show { display: block; }
  .card {
    display: block; background: var(--panel); border: 1.5px solid var(--edge);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
    text-decoration: none; color: var(--ink);
  }
  .card:active { background: #eadfc8; }
  .card .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 { margin: 0; font-size: 17px; color: var(--accent); }
  .card .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card p { margin: 6px 0 0; font-size: 13.5px; }
  .card .units { margin-top: 8px; display: flex; gap: 6px; }
  .card .units img { width: 30px; height: 30px; border-radius: 50%; padding: 2px; }
  .card .units img.p0 { background: rgb(110,160,210); }
  .card .units img.p1 { background: rgb(150,60,60); }
  .back-link { font-size: 13px; margin-top: 4px; }
  .back-link a { color: var(--accent); text-decoration: none; }
  /* hex styling */
  .hex { stroke: var(--hex-line); stroke-width: 1.2; }
  .hex.reach { cursor: pointer; }
  .hex.reach-glow { fill-opacity: 0.9; }
  .unit-chip { cursor: pointer; }
  .dmg-preview { font-family: Georgia, serif; font-weight: bold; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>OLD WORLD</h1>
    <div class="day">Daily Combat Puzzle · <span id="day-label"></span></div>
    <div class="puzzle-title" id="p-name"></div>
    <div class="brief" id="p-brief"></div>
    <div class="back-link" id="back-link"></div>
  </header>
  <div id="home"></div>
  <div class="hud">
    <div class="orders">Orders: <span id="orders-pips"></span></div>
  </div>
  <div id="board-wrap"></div>
  <div class="controls">
    <button id="btn-undo">Undo</button>
    <button id="btn-reset">Reset</button>
  </div>
  <div id="status"></div>
  <div id="result">
    <h2 id="result-title"></h2>
    <div id="result-body"></div>
    <div class="lesson" id="result-lesson"></div>
    <div style="margin-top:10px">
      <button class="primary" id="btn-share">Share</button>
      <button id="btn-again">Try again</button>
    </div>
  </div>
  <div class="library" id="library"></div>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="engine.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
