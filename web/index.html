<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Old World — Combat Puzzles</title>
<style>
  :root {
    --bg: #efe3cb;
    --panel: #faf3e3;
    --ink: #392e1f;
    --muted: #7a6a52;
    --accent: #8c2f1b;
    --blue: #2b6cb0;
    --red: #b03030;
    --hex-line: #c9b891;
    --edge: #b9a680;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #221c12; --panel: #2f2819; --ink: #e8dcc4; --muted: #a89877;
            --hex-line: #57492f; --edge: #6a5a3f; --accent: #c25a3a; }
  }
  :root[data-theme="dark"] { --bg: #221c12; --panel: #2f2819; --ink: #e8dcc4; --muted: #a89877;
            --hex-line: #57492f; --edge: #6a5a3f; --accent: #c25a3a; }
  :root[data-theme="light"] { --bg: #efe3cb; --panel: #faf3e3; --ink: #392e1f; --muted: #7a6a52;
            --hex-line: #c9b891; --edge: #b9a680; --accent: #8c2f1b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  /* Header has three jobs and they are kept apart: a site bar (who you are,
     where you can go), the puzzle's own identity, and — down on the board —
     the state of play. */
  header { width: 100%; max-width: 1100px; padding: 0 12px; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; padding: 8px 0 7px;
    border-bottom: 1px solid var(--edge); }
  .brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none;
    color: inherit; min-width: 0; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 4px; font-weight: 600; white-space: nowrap; }
  .brand-sub { font-size: 10.5px; color: var(--muted); letter-spacing: 2px;
    text-transform: uppercase; white-space: nowrap; }
  .brand:hover h1 { color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--muted); justify-content: flex-end; }
  #auth-widget { display: inline-flex; align-items: center; gap: 7px; }
  .whoami { display: inline-flex; align-items: center; gap: 6px; color: var(--ink);
    text-decoration: none; }
  .whoami img { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--edge); }
  .whoami:hover { color: var(--accent); }
  .whorating { font-size: 11.5px; color: var(--muted); border: 1px solid var(--edge);
    border-radius: 999px; padding: 1px 7px; }
  .whoadmin { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--edge); }
  .whoadmin:hover { color: var(--accent); }
  .titleblock { text-align: center; padding: 12px 0 0; }
  header .day { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  @media (max-width: 520px) {
    .topbar { padding: 6px 0 5px; }
    .brand-sub { display: none; }
    .topbar-right { gap: 8px; font-size: 12px; }
    .titleblock { padding-top: 9px; }
  }
  .puzzle-title { font-size: 17px; font-weight: bold; margin-top: 6px; color: var(--accent); }
  .brief { font-size: 14px; max-width: 480px; margin: 2px auto 0; padding: 0 8px; }
  /* a community puzzle is somebody's work — say whose, and link to them */
  .byline { font-size: 13px; margin-top: 4px; color: var(--muted); }
  .byline a { color: var(--accent); font-weight: bold; text-decoration: none;
    border-bottom: 1px solid rgba(194,90,58,.45); }
  .byline a:hover { border-bottom-color: var(--accent); }
  .byline img { width: 18px; height: 18px; border-radius: 50%; vertical-align: -4px;
    margin-right: 4px; }
  /* state of play: discrete facts, read at a glance, not a sentence */
  .hud {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    margin: 10px 0 0; font-size: 13.5px; flex-wrap: wrap; padding: 0 10px;
  }
  /* wrappers must not become flex items themselves, or the pills inside them
     lose the row's gap */
  .hud-group { display: contents; }
  .hud .pill { display: inline-flex; align-items: baseline; gap: 5px;
    border: 1px solid var(--edge); border-radius: 999px; padding: 3px 11px;
    white-space: nowrap; }
  .hud .pill b { font-size: 15px; }
  .hud .str-killed { border-color: rgba(194,90,58,.5); }
  .hud-hint { color: var(--muted); font-size: 12px; font-style: italic; }
  @media (max-width: 520px) { .hud-hint { display: none; } }
  .orders b { font-size: 16px; }
  .order-pip { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); margin-left: 3px; vertical-align: middle; }
  .order-pip.spent { background: #d8c8ac; }
  .str-killed { color: #b0483c; white-space: nowrap; }
  .str-killed b { font-size: 16px; }
  .iconstyle-btn { background: none; border: 1px solid rgba(140,130,110,0.45); color: var(--muted);
    font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; }
  .iconstyle-btn:hover { color: var(--accent); border-color: var(--accent); }
  /* the off-site links are the last thing you need, so they live last */
  .site-footer { margin: 26px 0 18px; font-size: 12px; color: var(--muted);
    text-align: center; padding: 0 14px; }
  .site-footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--edge); }
  .site-footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .site-footer .dot { margin: 0 8px; opacity: .6; }
  #main-row {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 10px; width: 100%; max-width: 900px;
  }
  #board-wrap { width: 100%; max-width: 560px; padding: 4px; flex: 1 1 340px; }
  #preview-panel {
    background: #14161c; color: #e8e4d8; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; margin: 4px;
    font-family: system-ui, sans-serif;
  }
  /* Wide screens: the panel column is ALWAYS reserved so showing the
     breakdown never reflows the board mid-hover. */
  @media (min-width: 880px) {
    #main-row { flex-wrap: nowrap; }
    #preview-panel { display: block; flex: 0 0 300px; width: 300px; align-self: stretch; }
    #preview-panel:not(.show) > * { display: none; }
    #preview-panel:not(.show)::before {
      content: 'Select a unit and hover an enemy to preview the attack.';
      color: #6d7078; font-size: 12px;
    }
  }
  /* Narrow screens: fixed bottom sheet — overlays, never shifts layout. */
  @media (max-width: 879.98px) {
    #preview-panel { display: none; }
    #preview-panel.show {
      display: block; position: fixed; z-index: 30;
      bottom: 10px; left: 50%; transform: translateX(-50%);
      width: min(94vw, 340px);
      box-shadow: 0 6px 28px rgba(0,0,0,.55);
    }
  }
  #preview-panel h4 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: #ffb020; display: flex; align-items: center; gap: 6px;
  }
  #preview-panel .vs { display: flex; gap: 10px; }
  #preview-panel .col { flex: 1; }
  #preview-panel .who { display: flex; align-items: center; gap: 5px; font-weight: 600; margin-bottom: 3px; }
  #preview-panel .who img { width: 22px; height: 22px; border-radius: 50%; }
  #preview-panel .who img.p0 { background: rgb(110,160,210); }
  #preview-panel .who img.p1 { background: rgb(150,60,60); }
  #preview-panel .big { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #preview-panel .modline { display: flex; justify-content: space-between; color: #b9b4a4; font-size: 12px; }
  #preview-panel .modline .v.pos { color: #7fb069; }
  #preview-panel .modline .v.neg { color: #e06c5b; }
  #preview-panel hr { border: none; border-top: 1px solid #3a3d46; margin: 8px 0; }
  #preview-panel .result { display: flex; justify-content: space-between; font-size: 13px; }
  #preview-panel .result b.kill { color: #ff5040; }
  #preview-panel .result b.dmg { color: #ffb020; }
  #preview-panel .note { color: #b9b4a4; font-size: 12px; margin-top: 5px; }
  #preview-panel .arm { margin-top: 8px; text-align: center; color: #ffb020; font-size: 12px; }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .controls { display: flex; gap: 10px; margin: 6px 0 4px; flex-wrap: wrap; justify-content: center; }
  .controls-final { margin-top: 2px; }
  button {
    font-family: inherit; font-size: 15px; padding: 8px 18px;
    background: var(--panel); color: var(--ink);
    border: 1.5px solid var(--edge); border-radius: 8px; cursor: pointer;
  }
  button:active { background: #eadfc8; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:active { background: var(--panel); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status {
    min-height: 40px; font-size: 14px; text-align: center; max-width: 480px;
    padding: 4px 10px;
  }
  #result {
    display: none; text-align: center; background: var(--panel);
    border: 1.5px solid var(--edge); border-radius: 12px; padding: 14px 22px;
    margin: 6px; max-width: 440px;
  }
  #result.show { display: block; }
  #result h2 { margin: 0 0 6px; font-size: 20px; }
  .lesson { font-size: 13px; font-style: italic; color: var(--muted); margin-top: 8px; }
  .library { font-size: 13px; margin: 10px 0 18px; color: var(--muted); text-align: center; }
  .library a { color: var(--accent); margin: 0 4px; }
  /* puzzle library (home) */
  #home { width: 100%; max-width: 780px; padding: 10px 14px 30px; display: none; }
  #home.show { display: block; }
  /* library bar: where you stand, and what you can do about it */
  .libbar { display: flex; align-items: center; justify-content: space-between;
    gap: 12px 16px; flex-wrap: wrap; margin: 4px 0 16px; padding: 10px 14px;
    border: 1px solid var(--edge); border-radius: 12px; background: var(--panel); }
  .libstat { flex: 1 1 200px; min-width: 180px; }
  .libcount { font-size: 13.5px; color: var(--muted); }
  .libcount b { color: var(--accent); font-size: 17px; }
  .libmeter { height: 5px; border-radius: 3px; background: rgba(140,130,110,.28); margin-top: 6px; }
  .libmeter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .libactions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .libactions .libact { font-size: 12.5px; color: var(--muted); text-decoration: none;
    border: 1px solid var(--edge); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  .libactions .libact:hover { color: var(--accent); border-color: var(--accent); }
  .libactions .rated-btn { text-decoration: none; }
  @media (max-width: 520px) {
    .libbar { margin-bottom: 12px; padding: 9px 11px; }
    .libactions { width: 100%; }
  }
  #home .progress { text-align: center; font-size: 13.5px; color: var(--muted); margin-bottom: 4px; }
  #home .progress b { color: var(--accent); font-size: 16px; }
  #home h2.group {
    font-size: 12.5px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); margin: 22px 2px 10px; border-bottom: 1px solid var(--edge);
    padding-bottom: 5px;
  }
  #home .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .card { position: relative; display: flex; gap: 12px; align-items: flex-start; margin: 0; }
  .card:hover { border-color: var(--accent); }
  .card .hero {
    flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%;
    background: rgb(110,160,210); padding: 4px; box-sizing: border-box;
    border: 2px solid #2c2416;
  }
  .card .body { min-width: 0; }
  .card .done {
    position: absolute; top: 8px; right: 10px; font-size: 17px; color: #5f9e4c;
  }
  .card.solved { border-color: #5f9e4c; }
  .card .meta { margin-right: 20px; }
  .card .foes { margin-top: 6px; display: flex; gap: 4px; align-items: center; }
  .card .foes img { width: 22px; height: 22px; border-radius: 50%; padding: 2px; background: rgb(150,60,60); }
  .card .foes .vs { font-size: 11px; color: var(--muted); margin-right: 2px; letter-spacing: 1px; }
  .card {
    background: var(--panel); border: 1.5px solid var(--edge);
    border-radius: 12px; padding: 12px 14px;
    text-decoration: none; color: var(--ink);
  }
  .card:active { background: #eadfc8; }
  .card .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 { margin: 0; font-size: 16.5px; color: var(--accent); }
  .card .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card p { margin: 5px 0 0; font-size: 13px; }
  .back-link { font-size: 13px; margin-top: 4px; }
  .back-link a { color: var(--accent); text-decoration: none; }
  #auth-widget a { color: var(--accent); }
  .rated-btn { font-family: inherit; font-size: 15px; padding: 8px 20px; border-radius: 9px;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  /* hex styling */
  .hex { stroke: var(--hex-line); stroke-width: 1.2; }
  .hex.reach { cursor: pointer; }
  .hex.reach-glow { fill-opacity: 0.9; }
  .unit-chip { cursor: pointer; }
  .dmg-preview { font-family: Georgia, serif; font-weight: bold; pointer-events: none; }
  /* ---------- achievement unlock ---------- */
  #achv-pop { position:fixed; z-index:60; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none; }
  .achv-card {
    position:relative; pointer-events:auto; cursor:pointer;
    display:flex; gap:12px; align-items:center;
    background:linear-gradient(135deg,#2b2415,#3b3018);
    color:#f6ecd2; border:1.5px solid #d4a12c; border-radius:12px;
    padding:11px 18px 11px 14px; min-width:262px; max-width:min(92vw,380px);
    box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 0 22px rgba(212,161,44,.16);
    animation:achv-in .62s cubic-bezier(.16,1.32,.42,1) both;
  }
  .achv-card.gone { animation:achv-out .42s ease-in forwards; }
  .achv-ico { font-size:31px; line-height:1; animation:achv-pulse 1.5s ease-in-out 2; }
  .achv-head { font-size:10px; letter-spacing:2.4px; text-transform:uppercase; color:#d4a12c; }
  .achv-name { font-size:17px; font-weight:bold; margin:1px 0 2px; }
  .achv-desc { font-size:11.5px; color:#c3b48f; line-height:1.3; }
  /* sweeping sheen across the card */
  .achv-card::after {
    content:''; position:absolute; inset:0; border-radius:12px; pointer-events:none;
    background:linear-gradient(105deg,transparent 34%,rgba(255,238,190,.42) 50%,transparent 66%);
    background-size:260% 100%; animation:achv-sheen 1.15s ease-out .28s 1;
  }
  .achv-spark {
    position:absolute; left:27px; top:50%; width:6px; height:6px; border-radius:50%;
    background:#ffdc7a; box-shadow:0 0 7px #ffcf4d; pointer-events:none;
    animation:achv-spark .85s ease-out forwards;
  }
  @keyframes achv-in {
    0% { opacity:0; transform:translateY(26px) scale(.82); }
    100% { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes achv-out {
    to { opacity:0; transform:translateY(-14px) scale(.95); } }
  @keyframes achv-pulse {
    0%,100% { transform:scale(1) rotate(0); } 28% { transform:scale(1.28) rotate(-9deg); } }
  @keyframes achv-sheen { from { background-position:150% 0; } to { background-position:-90% 0; } }
  @keyframes achv-spark {
    from { opacity:1; transform:translate(0,0) scale(1); }
    to { opacity:0; transform:translate(var(--dx),var(--dy)) scale(.25); } }
  @media (prefers-reduced-motion: reduce) {
    .achv-card, .achv-ico { animation:none; }
    .achv-card::after { display:none; } }
</style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="./"><h1>OLD WORLD</h1><span class="brand-sub">Combat Puzzles</span></a>
      <div class="topbar-right">
        <span id="auth-widget"></span>
      </div>
    </div>
    <div class="titleblock">
      <div class="day"><span id="day-label"></span></div>
      <div class="puzzle-title" id="p-name"></div>
      <div class="brief" id="p-brief"></div>
      <div class="byline" id="p-author"></div>
      <div class="back-link" id="back-link"></div>
    </div>
  </header>
  <div id="home"></div>
  <div class="hud">
    <span class="hud-group" id="orders-pips"></span>
    <span class="hud-group" id="training-span" style="display:none"></span>
  </div>
  <div id="main-row">
    <div id="board-wrap"></div>
    <div id="preview-panel"></div>
  </div>
  <div class="controls">
    <button id="btn-undo">↶ Undo</button>
    <button id="btn-redo">↷ Redo</button>
    <button id="btn-march" class="primary" style="display:none">Force March (−100 training)</button>
    <button id="btn-setup" class="primary" style="display:none">Unlimber</button>
  </div>
  <!-- Reset and End Turn sit on their own row: they are the two you must not
       hit by accident while clicking Undo repeatedly. -->
  <div class="controls controls-final">
    <button id="btn-reset">Reset</button>
    <button id="btn-endturn" class="primary" style="display:none">End Turn</button>
  </div>
  <div id="status"></div>
  <div id="result">
    <h2 id="result-title"></h2>
    <div id="result-body"></div>
    <div class="lesson" id="result-lesson"></div>
    <div style="margin-top:10px">
      <button class="primary" id="btn-next">Next puzzle ▶</button>
      <button id="btn-share">Share</button>
      <button id="btn-again">Try again</button>
    </div>
  </div>
  <div class="library" id="library"></div>

  <footer class="site-footer">
    <a href="https://store.steampowered.com/app/597180/Old_World/" target="_blank" rel="noopener">Buy Old World on Steam</a>
    <span class="dot">·</span>
    <a href="https://discord.com/invite/eg4gBUV" target="_blank" rel="noopener">Join the Old World Discord</a>
  </footer>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="engine.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
