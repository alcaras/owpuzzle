<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owpuzzle — hall of fame</title>
<style>
  /* Silver: the same star, spent — it was par when it was earned, and par has
     moved since. Greyscale keeps the shape (the badge still stands) while
     dropping the claim that it is the best line known. */
  .silver { filter: grayscale(1) brightness(1.15); opacity: .85; }
  .silver-note { color: var(--muted); font-weight: normal; font-size: .85em; }
  :root { --bg:#efe3cb; --panel:#faf3e3; --ink:#392e1f; --muted:#7a6a52; --accent:#8c2f1b; --edge:#b9a680; --gold:#b8860b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#221c12; --panel:#2f2819; --ink:#e8dcc4; --muted:#a89877; --edge:#6a5a3f; --accent:#c25a3a; --gold:#e0b040; } }
  :root[data-theme="dark"] { --bg:#221c12; --panel:#2f2819; --ink:#e8dcc4; --muted:#a89877; --edge:#6a5a3f; --accent:#c25a3a; --gold:#e0b040; }
  :root[data-theme="light"] { --bg:#efe3cb; --panel:#faf3e3; --ink:#392e1f; --muted:#7a6a52; --edge:#b9a680; --accent:#8c2f1b; --gold:#b8860b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,'Times New Roman',serif; padding:16px; }
  h1 { text-align:center; font-size:18px; letter-spacing:4px; margin:6px 0 2px; }
  h2 { font-size:12.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted);
       border-bottom:1px solid var(--edge); padding-bottom:5px; margin:26px 0 12px;
       text-align:left; }
  .wrap { max-width:820px; margin:0 auto; }
  .note { text-align:center; color:var(--muted); font-size:13px; }
  a { color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; background:var(--panel); }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--edge); }
  th { font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.me { background:rgba(184,134,11,0.14); }
  .rank { font-weight:bold; width:44px; }
  .medal { font-size:15px; }
  .avatar { width:24px; height:24px; border-radius:50%; vertical-align:-7px; margin-right:7px;
           border:1px solid var(--edge); background:var(--bg); }
  /* profile */
  .phead { display:flex; align-items:center; gap:14px; background:var(--panel);
           border:1px solid var(--edge); border-radius:12px; padding:14px 16px; margin-top:10px; }
  .phead img { width:56px; height:56px; border-radius:50%; border:2px solid var(--edge); background:var(--bg); }
  .phead h3 { margin:0 0 4px; font-size:19px; }
  .phead > div { text-align:left; }
  .pstats { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12.5px;
            align-items:baseline; }
  .pstats span { white-space:nowrap; }
  .pstats span + span { border-left:1px solid var(--edge); padding-left:14px; }
  .pstats b { color:var(--ink); font-size:15px; font-variant-numeric:tabular-nums; }
  .badges { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .badge { display:flex; gap:10px; align-items:flex-start; text-align:left;
           background:var(--panel); border:1px solid var(--edge); border-radius:10px;
           padding:10px 12px; }
  .badge > div { flex:1; min-width:0; }
  .badge.locked { opacity:0.5; }
  .badge.earned { border-color:var(--gold); box-shadow:inset 0 0 0 1px rgba(184,134,11,0.25); }
  .badge .ico { flex:0 0 auto; width:26px; font-size:23px; line-height:1; filter:grayscale(1); }
  .badge.earned .ico { filter:none; }
  .badge .nm { font-weight:bold; font-size:13.5px; }
  .badge .ds { font-size:11.5px; color:var(--muted); line-height:1.35; }
  .settings { display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; border:1px solid var(--edge); border-radius:10px;
    padding:10px 12px; background:var(--panel); }
  .settings .ds { font-size:11.5px; color:var(--muted); display:block; }
  .segmented { display:flex; border:1px solid var(--edge); border-radius:8px; overflow:hidden; }
  .segmented button { font-family:inherit; font-size:13px; padding:5px 12px; border:0;
    background:transparent; color:var(--ink); cursor:pointer; }
  .segmented button.on { background:var(--accent); color:#fff; }
  .bar { height:4px; background:var(--edge); border-radius:2px; margin-top:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--gold); }
  .recent { font-size:13px; }
  .recent li { margin:3px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HALL OF FAME</h1>
  <p class="note"><a href="./">← library</a> · ranked by puzzles completed</p>
  <div id="content" class="note">loading…</div>
</div>
<script>
function esc(x) { return String(x == null ? '' : x).replace(/[<>&]/g, function (c) {
  return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
var params = new URLSearchParams(location.search);
var who = params.get('u');
var el = document.getElementById('content');

if (who || params.get('me')) renderProfile(); else renderHall();

function renderHall() {
  fetch('/api/hall').then(function (r) { return r.json(); }).then(function (d) {
    if (d.error) { el.innerHTML = esc(d.error) + ' — <a href="/auth/discord">sign in with Discord</a>'; return; }
    if (!d.players.length) { el.textContent = 'no solves yet — be the first!'; return; }
    var MEDAL = { 1: '🥇', 2: '🥈', 3: '🥉' };
    var h = '<p class="note">' + d.players.length + ' player' + (d.players.length === 1 ? '' : 's') +
      ' · ' + d.total + ' puzzles live · <a href="?me=1">my achievements</a></p>' +
      '<table><tr><th class="rank">#</th><th>Player</th><th class="num">Solved</th>' +
      '<th class="num">Perfect</th><th class="num">Made</th></tr>';
    var meRow = d.players.filter(function (p) { return p.me; })[0];
    var shown = d.players.slice(0, 50);
    if (meRow && shown.indexOf(meRow) < 0) shown.push(meRow);  // always show yourself
    shown.forEach(function (p) {
      h += '<tr class="' + (p.me ? 'me' : '') + '">' +
        '<td class="rank">' + (MEDAL[p.rank] ? '<span class="medal">' + MEDAL[p.rank] + '</span>' : p.rank) + '</td>' +
        '<td><img class="avatar" src="' + esc(p.avatar) + '" alt="" loading="lazy">' +
        '<a href="?u=' + encodeURIComponent(p.name) + '"><b>' + esc(p.name) + '</b></a></td>' +
        '<td class="num"><b>' + p.solved + '</b> <span style="color:var(--muted)">/ ' + d.total + '</span></td>' +
        '<td class="num">' + (p.perfect ? '⭐ ' + p.perfect : '—') + '</td>' +
        '<td class="num">' + (p.authored || '—') + '</td></tr>';
    });
    el.className = '';           // shed the centered .note styling
    el.innerHTML = h + '</table>';
  }).catch(function () { el.textContent = 'server not available'; });
}

function renderProfile() {
  fetch('/api/profile' + (who ? '?name=' + encodeURIComponent(who) : ''))
    .then(function (r) { return r.json(); }).then(function (d) {
    if (d.error) { el.innerHTML = esc(d.error) + ' — <a href="/auth/discord">sign in with Discord</a>'; return; }
    var p = d.player, s = d.stats;
    var earned = d.achievements.filter(function (a) { return a.earned; }).length;
    var h = '<div class="phead">' +
      '<img src="' + esc(p.avatar) + '" alt="">' +
      '<div><h3>' + esc(p.name) + '</h3><div class="pstats">' +
      '<span><b>' + s.solved + '</b> solved</span>' +
      '<span><b>' + s.perfect + '</b> perfect ⭐' +
        (s.silver ? ' <span class="silver-note" title="par has since moved under ' +
          s.silver + ' of them — the badge stands, the claim does not">(' +
          s.silver + ' silver)</span>' : '') + '</span>' +
      '<span><b>' + earned + '</b>/' + d.achievements.length + ' achievements</span>' +
      (p.rating != null ? '<span><b>' + p.rating + '</b> rating</span>' : '') +
      (s.authored ? '<span><b>' + s.authored + '</b> puzzle' + (s.authored === 1 ? '' : 's') + ' made</span>' : '') +
      '</div></div></div>';

    h += '<h2>Achievements — ' + earned + ' of ' + d.achievements.length + '</h2><div class="badges">';
    d.achievements.forEach(function (a) {
      var pct = Math.round(100 * a.progress / a.target);
      h += '<div class="badge ' + (a.earned ? 'earned' : 'locked') + '">' +
        '<div class="ico">' + a.icon + '</div><div style="min-width:0">' +
        '<div class="nm">' + esc(a.name) + (a.earned ? ' ✓' : '') +
          (a.retained ? '<span title="kept on record" style="color:var(--muted)"> (held)</span>' : '') + '</div>' +
        '<div class="ds">' + esc(a.desc) + '</div>' +
        (a.earned || a.target === 1 ? '' :
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="ds">' + a.progress + ' / ' + a.target + '</div>') +
        '</div></div>';
    });
    h += '</div>';

    // Display preferences belong with the player, not on every puzzle page.
    // They are per-device (kept in localStorage), so say so.
    if (p.me) {
      h += '<h2>Settings</h2><div class="settings">' +
        '<div><b>Unit art</b> <span class="ds">how units are drawn on the board — saved to your account</span></div>' +
        '<div class="segmented" id="art-toggle">' +
        '<button data-art="portrait">Portraits</button>' +
        '<button data-art="flag">Icons</button></div></div>';
    }

    if (d.authored && d.authored.length) {
      h += '<h2>Puzzles made</h2>' +
        '<table><tr><th>Puzzle</th><th class="num">Elo</th><th class="num">Solved by</th></tr>';
      d.authored.forEach(function (r) {
        h += '<tr><td><a href="/?p=' + esc(r.slug) + '">' + esc(r.name) + '</a></td>' +
          '<td class="num">' + (r.rating != null ? '<b>' + r.rating + '</b>' : '—') + '</td>' +
          '<td class="num">' + (r.solves || 0) + '</td></tr>';
      });
      h += '</table>';
    }

    if (d.conquests && d.conquests.length) {
      h += '<h2>Conquests — hardest first</h2>' +
        '<table><tr><th>Puzzle</th><th class="num">Elo</th><th class="num">Orders</th>' +
        '<th class="num">Par</th><th>Beaten</th></tr>';
      d.conquests.forEach(function (r) {
        h += '<tr><td><a href="/?p=' + esc(r.slug) + '">' + esc(r.name) + '</a></td>' +
          '<td class="num">' + (r.rating != null ? '<b>' + r.rating + '</b>' : '—') + '</td>' +
          '<td class="num">' + r.orders + '</td>' +
          '<td class="num">' + (r.star === 'gold' ? '⭐'
            : r.star === 'silver'
              ? '<span class="silver" title="This was par when you beat it (' + r.orders +
                '), but par is now ' + r.par + ' — someone has since found a shorter line">⭐</span>'
              : '—') + '</td>' +
          '<td>' + esc((r.at || '').slice(0, 10)) + '</td></tr>';
      });
      h += '</table><p class="note" style="text-align:left;margin-top:6px">' +
        'A puzzle\u2019s rating is revealed once <em>you</em> beat it.</p>';
    }
    h += '<p class="note" style="margin-top:22px"><a href="hall.html">← hall of fame</a></p>';
    el.className = '';           // shed the centered .note styling
    el.innerHTML = h;
    var seg = document.getElementById('art-toggle');
    if (seg) {
      // the account's stored choice is the truth; the browser copy is only a
      // fallback for players who have not signed in
      var cur = p.unitArt || 'portrait';
      if (!p.unitArt) { try { cur = localStorage.getItem('owpuzzle-iconstyle') || 'portrait'; } catch (e) {} }
      try { localStorage.setItem('owpuzzle-iconstyle', cur); } catch (e) {}
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
        if (b.getAttribute('data-art') === cur) b.classList.add('on');
        b.onclick = function () {
          var val = b.getAttribute('data-art');
          try { localStorage.setItem('owpuzzle-iconstyle', val); } catch (e) {}
          // signed in, the choice belongs to the account and follows you to
          // any browser; the local copy is just what this page paints with now
          fetch('/api/settings', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ unitArt: val }),
          }).catch(function () {});
          Array.prototype.forEach.call(seg.querySelectorAll('button'), function (o) { o.classList.remove('on'); });
          b.classList.add('on');
        };
      });
    }
  }).catch(function () { el.textContent = 'server not available'; });
}
</script>
</body>
</html>
