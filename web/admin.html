<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owpuzzle — admin</title>
<style>
  :root { --bg:#efe3cb; --panel:#faf3e3; --ink:#392e1f; --muted:#7a6a52; --accent:#8c2f1b; --edge:#b9a680; }
  @media (prefers-color-scheme: dark) { :root { --bg:#221c12; --panel:#2f2819; --ink:#e8dcc4; --muted:#a89877; --edge:#6a5a3f; --accent:#c25a3a; } }
  :root[data-theme="dark"] { --bg:#221c12; --panel:#2f2819; --ink:#e8dcc4; --muted:#a89877; --edge:#6a5a3f; --accent:#c25a3a; }
  :root[data-theme="light"] { --bg:#efe3cb; --panel:#faf3e3; --ink:#392e1f; --muted:#7a6a52; --edge:#b9a680; --accent:#8c2f1b; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,serif; padding:16px; }
  h1 { text-align:center; font-size:18px; letter-spacing:4px; }
  h2 { font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--edge); padding-bottom:4px; margin-top:28px; }
  .wrap { max-width:860px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; background:var(--panel); }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--edge); }
  th { font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .pending { color:var(--accent); font-weight:bold; }
  a { color:var(--accent); }
  .note { text-align:center; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OWPUZZLE — ADMIN</h1>
  <p class="note"><a href="./">← library</a> · ratings converge as attempts accumulate (rd = uncertainty)</p>
  <div id="records"></div>
  <div id="content" class="note">loading…</div>
</div>
<script>
function esc0(x) { return String(x == null ? '' : x).replace(/</g, '&lt;'); }

// Lines that beat the published answer. Nothing here changes the library on
// its own: a record is either a better solution to fold in, or a bug in the
// engine that let it through, and only a human can tell which.
function renderRecords() {
  fetch('/api/admin/records').then(function (r) { return r.json(); }).then(function (d) {
    var host = document.getElementById('records');
    if (!host || !d.records || !d.records.length) return;
    var h = '<h2>⚑ Better than par — ' + d.records.length + ' to review</h2>' +
      '<table><tr><th>Puzzle</th><th>Player</th><th>Result</th><th>Published</th>' +
      '<th>When</th><th></th></tr>';
    d.records.forEach(function (r) {
      var result = r.kind === 'strength'
        ? '<b>' + (r.strKilled / 10) + ' STR</b> in ' + r.ordersUsed + ' orders'
        : (r.strKilled != null ? (r.strKilled / 10) + ' STR in ' : 'solved in ') + '<b>' + r.ordersUsed + '</b> orders';
      var par = (r.parCount ? (r.parCount / 10) + ' STR ceiling, ' : '') + 'par ' + r.parOrders;
      h += '<tr><td><a href="/?p=' + esc0(r.slug) + '">' + esc0(r.name) + '</a></td>' +
        '<td>' + esc0(r.player) + '</td><td>' + result + '</td><td>' + par + '</td>' +
        '<td>' + esc0((r.at || '').slice(0, 16)) + '</td>' +
        '<td><button data-rec="' + r.id + '" data-v="1">Fold in</button> ' +
        '<button data-rec="' + r.id + '" data-v="0">Dismiss</button> ' +
        '<button data-line="' + r.id + '">Line</button></td></tr>';
      h += '<tr id="line-' + r.id + '" style="display:none"><td colspan="6">' +
        '<code style="font-size:11.5px">' + esc0(JSON.stringify(r.line)) + '</code></td></tr>';
    });
    host.innerHTML = h + '</table>';
    Array.prototype.forEach.call(host.querySelectorAll('[data-line]'), function (b) {
      b.onclick = function () {
        var row = document.getElementById('line-' + b.getAttribute('data-line'));
        row.style.display = row.style.display === 'none' ? '' : 'none';
      };
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-rec]'), function (b) {
      b.onclick = function () {
        fetch('/api/admin/records/' + b.getAttribute('data-rec'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accept: b.getAttribute('data-v') === '1' }),
        }).then(function () { renderRecords(); });
      };
    });
  }).catch(function () {});
}

var showAll = new URLSearchParams(location.search).get('all') === '1';
fetch('/api/admin/stats' + (showAll ? '?all=1' : '')).then(r => r.json()).then(d => {
  if (d.error) { document.getElementById('content').textContent = d.error + ' — sign in as admin first'; return; }
  function esc(x) { return String(x == null ? '' : x).replace(/</g, '&lt;'); }
  renderRecords();
  var h = '<h2>Puzzle ratings (' + d.puzzles.length + ')</h2>' +
    '<p class="note" style="text-align:left;margin:0 0 8px">' + (showAll
      ? 'showing every row including retired/rejected \u00b7 <a href="?">hide them</a>'
      : 'live + pending only \u00b7 <a href="?all=1">show retired &amp; rejected</a>') + '</p>' +
    '<table><tr>' +
    '<th>Puzzle</th><th>Status</th><th>Author</th><th class="num">Rating</th><th class="num">±RD</th>' +
    '<th class="num">Attempts</th><th class="num">Solves</th><th class="num">Solve %</th></tr>';
  d.puzzles.forEach(function (p) {
    h += '<tr><td><a href="?p=' + esc(p.slug) + '" href="/?p=' + esc(p.slug) + '">' + esc(p.name) + '</a></td>' +
      '<td class="' + (p.status === 'pending' ? 'pending' : '') + '">' + esc(p.status) + '</td>' +
      '<td>' + esc(p.author) + '</td><td class="num"><b>' + p.rating + '</b></td><td class="num">' + p.rd + '</td>' +
      '<td class="num">' + p.attempts + '</td><td class="num">' + p.solves + '</td>' +
      '<td class="num">' + (p.attempts ? Math.round(100 * p.solves / p.attempts) + '%' : '—') + '</td></tr>';
  });
  h += '</table><h2>Players (' + d.users.length + ')</h2><table><tr>' +
    '<th>Player</th><th class="num">Rating</th><th class="num">±RD</th><th class="num">Solved</th>' +
    '<th class="num">Attempts</th><th>Since</th></tr>';
  d.users.forEach(function (u) {
    h += '<tr><td><b>' + esc(u.name) + '</b></td><td class="num"><b>' + u.rating + '</b></td>' +
      '<td class="num">' + u.rd + '</td><td class="num">' + u.solved + '</td>' +
      '<td class="num">' + u.attempts + '</td><td>' + esc((u.since || '').slice(0, 10)) + '</td></tr>';
  });
  h += '</table>';
  document.getElementById('content').innerHTML = h.replace(/href="\?p=/g, 'href="/?p=');
});
</script>
</body>
</html>
